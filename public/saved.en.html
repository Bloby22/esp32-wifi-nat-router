<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0878bd">
  <title>ESP Connect | Settings saved</title>
  <link rel="stylesheet" href="/style.css?v=4">
</head>
<body class="app-shell">
  <header class="topbar">
    <a class="brand" href="/" aria-label="ESP Connect home">
      <span class="brand-mark">ESP</span>
      <span class="brand-name">ESP Connect<span>WI-FI NAT ROUTER</span></span>
    </a>
    <div class="header-status">RESTARTING</div>
  </header>
  <main class="confirmation-wrap">
    <section class="confirmation-card">
      <span class="confirmation-mark" aria-hidden="true">✓</span>
      <p class="eyebrow">WI-FI SETTINGS / SAVED</p>
      <h1>Settings saved</h1>
      <p>The ESP32-C3 is restarting. The new ESP network name is <strong>{{SSID}}</strong>.</p>
      <p class="confirmation-note">Reconnect to the new ESP network after restart, then open <a href="http://192.168.4.1/">192.168.4.1</a>.</p>
    </section>
  </main>
</body>
</html>
