<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0878bd">
  <title>ESP Connect | Nastavení uloženo</title>
  <link rel="stylesheet" href="/style.css?v=4">
</head>
<body class="app-shell">
  <header class="topbar">
    <a class="brand" href="/" aria-label="ESP Connect – úvod">
      <span class="brand-mark">ESP</span>
      <span class="brand-name">ESP Connect<span>WI-FI PŘÍSTUPOVÝ BOD</span></span>
    </a>
    <div class="header-status">PROBÍHÁ RESTART</div>
  </header>
  <main class="confirmation-wrap">
    <section class="confirmation-card">
      <span class="confirmation-mark" aria-hidden="true">✓</span>
      <p class="eyebrow">NASTAVENÍ WI-FI / ULOŽENO</p>
      <h1>Nastavení bylo uloženo</h1>
      <p>ESP32-C3 se restartuje. Nový název vlastní sítě je <strong>{{SSID}}</strong>.</p>
      <p class="confirmation-note">Po restartu se připojte k nové síti ESP a otevřete <a href="http://192.168.4.1/">192.168.4.1</a>.</p>
    </section>
  </main>
</body>
</html>
