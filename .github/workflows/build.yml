name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  envs:
    name: List environments
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Read environments from platformio.ini
        id: list
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import configparser, json, sys
          cp = configparser.ConfigParser(interpolation=None, strict=False)
          cp.read("platformio.ini")
          envs = [s[4:] for s in cp.sections() if s.startswith("env:")]
          if not envs:
              sys.exit("No [env:...] sections found in platformio.ini")
          print("matrix=" + json.dumps({"env": envs}))
          EOF

  build:
    name: Build (${{ matrix.env }})
    needs: envs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.envs.outputs.matrix) }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        run: pio run -e ${{ matrix.env }}

      - name: Build LittleFS image
        run: pio run -e ${{ matrix.env }} --target buildfs

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: |
            .pio/build/${{ matrix.env }}/firmware.bin
            .pio/build/${{ matrix.env }}/littlefs.bin
            .pio/build/${{ matrix.env }}/bootloader.bin
            .pio/build/${{ matrix.env }}/partitions.bin
          if-no-files-found: warn
          retention-days: 14